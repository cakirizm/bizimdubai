name: Flutter Discover verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/main.dart'
      - 'lib/discover/**'
      - 'scripts/apply_restaurant_grouping.py'
      - 'test/discover_test.dart'
      - 'assets/images/logo.b64'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore runtime logo asset
        run: python -c "import base64,pathlib; p=pathlib.Path('assets/images'); (p/'logo.png').write_bytes(base64.b64decode((p/'logo.b64').read_text(), validate=True))"
      - name: Validate restaurant grouping build patch
        run: python scripts/apply_restaurant_grouping.py
      - name: Dependencies
        run: flutter pub get
      - name: Analyze production Discover path
        run: flutter analyze --no-fatal-infos lib/main.dart test/discover_test.dart
      - name: Discover tests
        run: flutter test test/discover_test.dart
