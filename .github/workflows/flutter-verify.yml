name: Flutter Discover verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/main.dart'
      - 'lib/home/**'
      - 'lib/discover/**'
      - 'test/discover_test.dart'
      - 'test/home_navigation_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze production Discover path
        run: flutter analyze --no-fatal-infos lib/main.dart test/discover_test.dart test/home_navigation_test.dart
      - name: Discover tests
        run: flutter test test/discover_test.dart test/home_navigation_test.dart
