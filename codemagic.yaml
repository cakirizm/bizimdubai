workflows:
  ios-ci:
    name: BizimDubai iOS CI
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS project
        script: |
          flutter create --platforms=ios --org com.cakirizm --project-name bizimdubai .
      - name: Restore application source and logo
        script: |
          base64 --decode lib/main.dart.gz.b64 | gzip -d > lib/main.dart
          mkdir -p assets/images
          base64 --decode assets/images/logo.b64 > assets/images/logo.png
      - name: Get packages
        script: flutter pub get
      - name: Generate iOS app icons
        script: dart run flutter_launcher_icons
      - name: Analyze
        script: flutter analyze
      - name: Build iOS simulator app
        script: flutter build ios --simulator --debug --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: BizimDubai iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.cakirizm.bizimdubai
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS project
        script: |
          flutter create --platforms=ios --org com.cakirizm --project-name bizimdubai .
      - name: Restore application source and logo
        script: |
          base64 --decode lib/main.dart.gz.b64 | gzip -d > lib/main.dart
          mkdir -p assets/images
          base64 --decode assets/images/logo.b64 > assets/images/logo.png
      - name: Get packages
        script: flutter pub get
      - name: Generate iOS app icons
        script: dart run flutter_launcher_icons
      - name: Analyze
        script: flutter analyze
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch Apple signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificates
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/*.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
