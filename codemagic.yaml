workflows:
  ios-ci:
    name: BizimDubai iOS CI
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS project
        script: |
          flutter create --platforms=ios --org com.cakirizm --project-name bizimdubai .
          rm -f test/widget_test.dart
      - name: Prepare brand assets
        script: python3 scripts/prepare_brand.py
      - name: Get packages
        script: flutter pub get
      - name: Generate discover seed
        script: dart run scripts/generate_discover_seed.dart
      - name: Group restaurant branches and photo fallbacks
        script: python3 scripts/apply_restaurant_grouping.py
      - name: Test navigation and discover data
        script: flutter test
      - name: Analyze
        script: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build iOS simulator app
        script: flutter build ios --simulator --debug --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: BizimDubai iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BizimDubai2026
    environment:
      vars:
        BUNDLE_ID: com.cakirizm.bizimdubai
        APP_STORE_APPLE_ID: 6809072117
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cakirizm.bizimdubai
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS project
        script: |
          flutter create --platforms=ios --org com.cakirizm --project-name bizimdubai .
          rm -f test/widget_test.dart
      - name: Prepare brand assets
        script: python3 scripts/prepare_brand.py
      - name: Get packages
        script: flutter pub get
      - name: Generate discover seed
        script: dart run scripts/generate_discover_seed.dart
      - name: Group restaurant branches and photo fallbacks
        script: python3 scripts/apply_restaurant_grouping.py
      - name: Test navigation and discover data
        script: flutter test
      - name: Analyze
        script: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA with next TestFlight build number
        script: |
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform=IOS 2>/dev/null || true)
          if [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          else
            NEXT_BUILD_NUMBER="$BUILD_NUMBER"
          fi
          echo "Using iOS build number: $NEXT_BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$NEXT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
